
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07130f">
  <meta name="mobile-web-app-capable" content="yes">
  <title>WILD ISLAND: SURVIVAL</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07130f;
      color: white;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #game-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: radial-gradient(circle, #183c2c, #07130f 75%);
      text-align: center;
      padding: 24px;
    }

    #loading-screen h1 {
      font-size: 30px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    #loading-screen p {
      color: #b8d2c0;
      font-size: 13px;
    }

    .loading-bar {
      width: min(260px, 80vw);
      height: 5px;
      margin-top: 22px;
      background: #294537;
      border-radius: 10px;
      overflow: hidden;
    }

    .loading-progress {
      height: 100%;
      width: 0%;
      background: #79d68b;
      transition: width .3s;
    }

    #error-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: #160b0b;
      padding: 25px;
      overflow: auto;
      color: #ffbaba;
      font-size: 13px;
      white-space: pre-wrap;
    }

    #error-screen h2 {
      color: white;
    }

    .hidden {
      display: none !important;
    }

    button {
      font: inherit;
    }
  </style>
</head>

<body>

  <div id="game-container"></div>

  <div id="loading-screen">
    <h1>WILD ISLAND</h1>
    <p>SURVIVAL EXPERIENCE</p>

    <div class="loading-bar">
      <div id="loading-progress" class="loading-progress"></div>
    </div>

    <p id="loading-text">Oyun hazırlanır...</p>
  </div>

  <div id="error-screen">
    <h2>OYUN BAŞLADILA BİLMƏDİ</h2>
    <div id="error-message"></div>
  </div>

  <script>
    window.__boot = {
      started: Date.now(),
      errors: [],
      ready: false
    };

    window.addEventListener("error", function(event) {
      window.__boot.errors.push(
        (event.message || "Naməlum xəta") +
        "\nFayl: " + (event.filename || "naməlum") +
        "\nSətir: " + (event.lineno || 0)
      );
    });

    window.addEventListener("unhandledrejection", function(event) {
      window.__boot.errors.push(
        "Promise xətası: " + String(event.reason)
      );
    });

    window.showGameError = function(message) {
      const screen = document.getElementById("error-screen");
      const output = document.getElementById("error-message");

      if (screen && output) {
        screen.style.display = "block";
        output.textContent = String(message);
      }
    };

    window.setLoadingProgress = function(value, message) {
      const bar = document.getElementById("loading-progress");
      const label = document.getElementById("loading-text");

      if (bar) {
        bar.style.width = Math.max(0, Math.min(100, value)) + "%";
      }

      if (label && message) {
        label.textContent = message;
      }
    };

    window.hideLoadingScreen = function() {
      const screen = document.getElementById("loading-screen");
      if (screen) screen.classList.add("hidden");
    };
  </script>

  <!-- Three.js kitabxanası -->
  <script src="js/three.min.js"></script>

  <!-- Oyun konfiqurasiyası -->
  <script src="js/config.js"></script>
  <script src="shared/rules.js"></script>

  <!-- Dil və səs -->
  <script src="js/i18n.js"></script>
  <script src="js/i18n_v2.js"></script>
  <script src="js/audio.js"></script>

  <!-- Online sistem -->
  <script src="js/net.js"></script>

  <!-- Dünya və oyun sistemləri -->
  <script src="js/world.js"></script>
  <script src="js/character.js"></script>
  <script src="js/environment.js"></script>
  <script src="js/game.js"></script>

  <!-- Başlanğıc yoxlaması -->
  <script>
    window.addEventListener("load", function() {
      setTimeout(function() {
        if (!window.THREE) {
          showGameError(
            "Three.js yüklənmədi.\njs/three.min.js faylını yoxla."
          );
          return;
        }

        if (!window.WI) {
          showGameError("WI oyun sistemi yaradılmayıb.");
          return;
        }

        if (!window.WI.debug) {
          showGameError(
            "Oyun sistemi işə düşmədi.\n\n" +
            (window.__boot.errors.join("\n\n") || "Xəta məlumatı tapılmadı.")
          );
          return;
        }

        window.__boot.ready = true;
        setLoadingProgress(100, "Hazırdır!");
      }, 4000);
    });
  </script>

</body>
</html>
